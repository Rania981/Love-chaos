<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Chaos — Truth or Dare 💕</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"Space Grotesk"', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        pink: '#FF5C8A',
                        lavender: '#C7A4FF',
                        peach: '#FFD6C9',
                        cream: '#FFF8F3',
                        dark: '#222222',
                        success: '#6BCB77',

                        rose: '#FF5C8A',
                    },
                    borderRadius: {
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '28px',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js">
    </script>

    <!-- canvas-confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1">
    </script>

    <style>
        /* --- (all styles unchanged from previous version) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #FFF8F3;
            color: #222222;
            transition: background 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }
        body.dark {
            background: #111827;
            color: #ffffff;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #FF5C8A;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e04a7a;
        }
        .glass {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
        }
        .dark .glass {
            background: rgba(31, 41, 55, 0.65);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.60);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.30);
            border-radius: 24px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
        }
        .dark .glass-card {
            background: rgba(31, 41, 55, 0.70);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.3);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10);
        }
        .dark .glass-card:hover {
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-18px) rotate(3deg);
            }
        }
        @keyframes floatSlow {
            0%,
            100% {
                transform: translateY(0px) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.02);
            }
        }
        @keyframes heartBeat {
            0%,
            100% {
                transform: scale(1);
            }
            14% {
                transform: scale(1.15);
            }
            28% {
                transform: scale(1);
            }
            42% {
                transform: scale(1.10);
            }
            56% {
                transform: scale(1);
            }
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }
            100% {
                background-position: 200% 0;
            }
        }
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(255, 92, 138, 0.15);
            }
            50% {
                box-shadow: 0 0 60px rgba(255, 92, 138, 0.30);
            }
        }
        @keyframes confettiDrop {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(80vh) rotate(720deg) scale(1);
                opacity: 0;
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        .animate-float-slow {
            animation: floatSlow 8s ease-in-out infinite;
        }
        .animate-heart-beat {
            animation: heartBeat 1.8s ease-in-out infinite;
        }
        .animate-slide-up {
            animation: slideUp 0.8s ease-out forwards;
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        .animate-shimmer {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05) 25%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.05) 75%);
            background-size: 200% 100%;
            animation: shimmer 2s ease-in-out infinite;
        }

        .gradient-text {
            background: linear-gradient(135deg, #FF5C8A 0%, #C7A4FF 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #FF5C8A, #C7A4FF);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1.05rem;
            background: linear-gradient(135deg, #FF5C8A, #C7A4FF);
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 30px rgba(255, 92, 138, 0.30);
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 48px rgba(255, 92, 138, 0.40);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 1.05rem;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(8px);
            color: #222;
            border: 1px solid rgba(255, 255, 255, 0.30);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .dark .btn-secondary {
            background: rgba(31, 41, 55, 0.70);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.10);
        }
        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }
        .dark .btn-secondary:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }
        .hero-bg .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.30;
            animation: floatSlow 12s ease-in-out infinite;
        }
        .hero-bg .blob:nth-child(1) {
            width: 500px;
            height: 500px;
            background: #FF5C8A;
            top: -15%;
            right: -10%;
            animation-delay: 0s;
        }
        .hero-bg .blob:nth-child(2) {
            width: 400px;
            height: 400px;
            background: #C7A4FF;
            bottom: -10%;
            left: -10%;
            animation-delay: -4s;
        }
        .hero-bg .blob:nth-child(3) {
            width: 300px;
            height: 300px;
            background: #FFD6C9;
            top: 40%;
            left: 30%;
            animation-delay: -8s;
            opacity: 0.15;
        }
        .dark .hero-bg .blob {
            opacity: 0.20;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.20;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
            user-select: none;
        }

        .wheel-container {
            position: relative;
            width: 340px;
            height: 340px;
            margin: 0 auto;
        }
        @media (max-width: 640px) {
            .wheel-container {
                width: 280px;
                height: 280px;
            }
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 8px solid #FF5C8A;
            box-shadow: 0 0 60px rgba(255, 92, 138, 0.3), inset 0 0 60px rgba(255, 92, 138, 0.05);
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            left: 50%;
            transform-origin: 0% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            padding: 0 6px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            cursor: default;
            user-select: none;
        }
        .wheel-segment span {
            transform: rotate(90deg);
            display: block;
            font-size: 0.7rem;
            line-height: 1.2;
        }
        @media (max-width: 640px) {
            .wheel-segment span {
                font-size: 0.55rem;
            }
        }
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #FF5C8A, #C7A4FF);
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 40px rgba(255, 92, 138, 0.5);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
        }
        .dark .wheel-center {
            border-color: #111827;
        }
        .wheel-pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            font-size: 2.5rem;
            filter: drop-shadow(0 4px 12px rgba(255, 92, 138, 0.5));
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.4s ease-out;
        }
        .modal-content {
            max-width: 92%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem 2rem 2.5rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.20);
            position: relative;
            width: 480px;
        }
        .dark .modal-content {
            background: rgba(31, 41, 55, 0.94);
            backdrop-filter: blur(24px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .stat-number {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            background: linear-gradient(135deg, #FF5C8A, #C7A4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container-custom {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        @media (max-width: 640px) {
            .container-custom {
                padding: 0 16px;
            }
            .btn-primary,
            .btn-secondary {
                padding: 14px 28px;
                font-size: 0.95rem;
            }
        }

        .scroll-indicator {
            animation: float 2.8s ease-in-out infinite;
        }

        .badge-pulse {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiDrop linear forwards;
            pointer-events: none;
            z-index: 9999;
        }

        .surprise-popup {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 500;
            animation: slideUp 0.6s ease-out;
            max-width: 280px;
        }
        @media (max-width: 640px) {
            .surprise-popup {
                bottom: 16px;
                right: 16px;
                max-width: 200px;
                font-size: 0.9rem;
            }
        }

        .game-result-card {
            background: linear-gradient(135deg, rgba(255, 92, 138, 0.08), rgba(199, 164, 255, 0.08));
            border: 2px solid rgba(255, 92, 138, 0.15);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .dark .game-result-card {
            background: linear-gradient(135deg, rgba(255, 92, 138, 0.10), rgba(199, 164, 255, 0.10));
            border-color: rgba(255, 92, 138, 0.12);
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        // ============================================================
        //  LOVE CHAOS — Updated Truth & Dare Questions (50 each)
        // ============================================================

        const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

        const confetti = window.confetti || (() => {});

        const ThemeContext = createContext({ theme: 'light', toggleTheme: () => {} });
        const useTheme = () => useContext(ThemeContext);

        // ---- Truth Questions (combined from all categories) ----
        const truthQuestions = [
            // ❤️ Romantic
            "When did you first realize you liked me?",
            "What was your first impression of me?",
            "What's your favorite memory of us?",
            "What's one thing I do that always makes you smile?",
            "What's your favorite feature about me?",
            "What's something you've never told me?",
            "If we could travel anywhere, where would you take me?",
            "What's one habit of mine that you secretly find adorable?",
            "When do you feel closest to me?",
            "What's one thing you hope we do together in the future?",
            // ❤️ Deep
            "What's your biggest fear in a relationship?",
            "What makes you feel truly loved?",
            "What's something you're still healing from?",
            "What's one dream you haven't shared with many people?",
            "What's something you wish people understood about you?",
            "What's your biggest insecurity?",
            "What lesson has love taught you?",
            "What do you value more than money?",
            "What scares you about the future?",
            "What's one thing you never want to lose?",
            // 😂 Funny
            "What's the weirdest thing you've Googled?",
            "What's your most embarrassing moment?",
            "Have you ever walked into the wrong room by accident?",
            "What's the funniest lie you've told?",
            "What's the strangest food you've ever eaten?",
            "What's your most useless talent?",
            "Have you ever laughed at the wrong time?",
            "What's the weirdest dream you've had?",
            "If animals could talk, which would be the rudest?",
            "What's the funniest nickname you've ever had?",
            // 🤭 Couple Truths
            "Who apologizes first after an argument?",
            "Who spends longer getting ready?",
            "Who is more stubborn?",
            "Who says 'I'm fine' when they're clearly not?",
            "Who steals the blanket?",
            "Who is more dramatic?",
            "Who is more likely to cry during a movie?",
            "Who starts random conversations at bedtime?",
            "Who forgets where they put their phone more often?",
            "Who is most likely to laugh first during a serious moment?",
            // 🌙 Thought-Provoking
            "What would your perfect life look like in 10 years?",
            "If today were your last day, what would you regret not doing?",
            "What makes you happiest?",
            "What motivates you every morning?",
            "Who has influenced your life the most?",
            "What's one mistake that changed you?",
            "What's something you've forgiven yourself for?",
            "What's your biggest goal?",
            "What does 'home' mean to you?",
            "If you could relive one day, which would it be?",
        ];

        // ---- Dare Questions (combined from all categories) ----
        const dareQuestions = [
            // ❤️ Romantic
            "Hug your partner for 30 seconds.",
            "Hold hands for the next five minutes.",
            "Give your partner three genuine compliments.",
            "Look into your partner's eyes for 20 seconds without laughing.",
            "Recreate your first selfie together.",
            "Kiss your partner's forehead.",
            "Tell your partner why you appreciate them.",
            "Dance together for one minute without music.",
            "Say 'I love you' in three different languages.",
            "Pretend you're on your first date again.",
            // 😂 Funny
            "Talk like a robot for one minute.",
            "Act like a cat until your next turn.",
            "Pretend to be a news reporter describing the room.",
            "Try to make your partner laugh without touching them.",
            "Walk backwards for the next minute.",
            "Tell a joke using only hand gestures.",
            "Do your best celebrity impression.",
            "Speak in rhymes for two minutes.",
            "Balance a spoon on your nose for 20 seconds.",
            "Make your funniest face and hold it for 15 seconds.",
            // 🤣 Silly
            "Dance like nobody's watching.",
            "Pretend you're a movie villain.",
            "Make five different animal sounds.",
            "Sing the chorus of your favorite song dramatically.",
            "Tell a story using only emojis.",
            "Wear a blanket like a superhero cape.",
            "Invent a handshake with your partner.",
            "Talk in slow motion for one minute.",
            "Pretend the floor is lava for 30 seconds.",
            "Make up a commercial for your favorite snack.",
            // 💌 Cute
            "Send your partner a sweet message (if you're apart).",
            "Share your favorite memory together.",
            "Give your partner a high five and a hug.",
            "Write a short love note.",
            "Say five things you admire about your partner.",
            "Plan your next date in under one minute.",
            "Tell your partner what made you smile today.",
            "Take a funny selfie together.",
            "Draw a heart with your finger in the air.",
            "Finish this sentence: 'I'm happiest when we...'",
            // 🌟 Creative
            "Describe your partner as if they were a superhero.",
            "Create a silly nickname for your partner.",
            "Act out your dream vacation.",
            "Invent a new holiday for couples.",
            "Give your partner an award and explain why they won.",
            "Tell a bedtime story using random words.",
            "Pretend you're both contestants on a game show.",
            "Build the tallest tower you can using nearby objects.",
            "Describe your partner using only three emojis.",
            "Make up a secret team motto together.",
        ];

        // ============================================================
        //  COMPONENT: Floating Hearts
        // ============================================================
        const FloatingHearts = ({ count = 18 }) => {
            const emojis = ['❤️', '💕', '💖', '💗', '💝', '♥️', '💞', '💓'];
            const hearts = useMemo(() => {
                return Array.from({ length: count }, (_, i) => ({
                    id: i,
                    emoji: emojis[i % emojis.length],
                    left: 5 + Math.random() * 90,
                    delay: Math.random() * 12,
                    duration: 10 + Math.random() * 18,
                    size: 1.2 + Math.random() * 2.0,
                    opacity: 0.06 + Math.random() * 0.18,
                }));
            }, [count]);
            return (
                <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden', zIndex: 0 }}>
                    {hearts.map((h) => (
                        <div
                            key={h.id}
                            className="floating-heart"
                            style={{
                                left: h.left + '%',
                                top: Math.random() * 100 + '%',
                                fontSize: h.size + 'rem',
                                opacity: h.opacity,
                                animationDuration: h.duration + 's',
                                animationDelay: h.delay + 's',
                            }}
                        >
                            {h.emoji}
                        </div>
                    ))}
                </div>
            );
        };

        // ============================================================
        //  COMPONENT: Navbar
        // ============================================================
        const Navbar = ({ onToggleTheme }) => {
            const { theme } = useTheme();
            const isDark = theme === 'dark';
            return (
                <nav className="fixed top-0 left-0 right-0 z-50 px-4 sm:px-6 py-3 glass border-b border-white/20 dark:border-white/5">
                    <div className="container-custom flex items-center justify-between">
                        <div className="flex items-center gap-2.5 text-xl font-heading font-bold tracking-tight" style={{ color: '#FF5C8A' }}>
                            <span className="text-2xl animate-heart-beat">💕</span>
                            <span>Love Chaos</span>
                        </div>
                        <button
                            onClick={onToggleTheme}
                            className="p-2.5 rounded-full bg-white/40 dark:bg-darkCard/40 backdrop-blur-sm border border-white/20 dark:border-white/5 transition-all hover:scale-105"
                            aria-label="Toggle theme"
                        >
                            {isDark ? <span className="text-xl">☀️</span> : <span className="text-xl">🌙</span>}
                        </button>
                    </div>
                </nav>
            );
        };

        // ============================================================
        //  COMPONENT: Truth or Dare Game (with updated questions)
        // ============================================================
        const TruthOrDareGame = () => {
            const { theme } = useTheme();
            const isDark = theme === 'dark';

            const [isSpinning, setIsSpinning] = useState(false);
            const [rotation, setRotation] = useState(0);
            const [result, setResult] = useState(null);
            const [showResult, setShowResult] = useState(false);
            const [history, setHistory] = useState([]);
            const [gameModalOpen, setGameModalOpen] = useState(false);
            const [currentQuestion, setCurrentQuestion] = useState('');
            const [currentType, setCurrentType] = useState('');

            // Wheel segments: alternating Truth/Dare
            const wheelSegments = [
                { label: '❤️ Truth', type: 'truth', color: '#FF5C8A' },
                { label: '💪 Dare', type: 'dare', color: '#C7A4FF' },
                { label: '❤️ Truth', type: 'truth', color: '#FF8FAB' },
                { label: '💪 Dare', type: 'dare', color: '#D4B8FF' },
                { label: '❤️ Truth', type: 'truth', color: '#FF5C8A' },
                { label: '💪 Dare', type: 'dare', color: '#C7A4FF' },
                { label: '❤️ Truth', type: 'truth', color: '#FF8FAB' },
                { label: '💪 Dare', type: 'dare', color: '#D4B8FF' },
            ];

            // Use the global arrays defined above
            const getQuestions = (type) => type === 'truth' ? truthQuestions : dareQuestions;

            const spinWheel = () => {
                if (isSpinning) return;
                setIsSpinning(true);
                setResult(null);
                setShowResult(false);

                const spins = 5 + Math.random() * 3;
                const extra = Math.floor(Math.random() * wheelSegments.length);
                const totalRotation = spins * 360 + (extra * (360 / wheelSegments.length));
                const newRotation = rotation + totalRotation;
                setRotation(newRotation);

                setTimeout(() => {
                    const normalized = (totalRotation % 360 + 360) % 360;
                    const sectorAngle = 360 / wheelSegments.length;
                    const idx = Math.floor(normalized / sectorAngle) % wheelSegments.length;
                    const segment = wheelSegments[idx];
                    const questions = getQuestions(segment.type);
                    const question = questions[Math.floor(Math.random() * questions.length)];

                    setResult({ type: segment.type, label: segment.label, question, idx });
                    setCurrentType(segment.type);
                    setCurrentQuestion(question);
                    setShowResult(true);
                    setIsSpinning(false);

                    try {
                        confetti({
                            particleCount: segment.type === 'truth' ? 40 : 60,
                            spread: segment.type === 'truth' ? 60 : 80,
                            origin: { y: 0.6 },
                            colors: segment.type === 'truth' ? ['#FF5C8A', '#FF8FAB', '#FFB3C6'] : ['#C7A4FF', '#D4B8FF', '#E8D9FF']
                        });
                    } catch (e) {}

                    setHistory(prev => [...prev, { type: segment.type, label: segment.label, question, timestamp: Date.now() }]);

                    setTimeout(() => {
                        setGameModalOpen(true);
                    }, 600);

                }, 5000);
            };

            const closeModal = () => {
                setGameModalOpen(false);
                setShowResult(false);
            };

            const getNewQuestion = () => {
                const questions = getQuestions(currentType);
                const q = questions[Math.floor(Math.random() * questions.length)];
                setCurrentQuestion(q);
                setHistory(prev => [...prev, { type: currentType, label: currentType === 'truth' ? '❤️ Truth' : '💪 Dare', question: q, timestamp: Date.now() }]);
                try {
                    confetti({
                        particleCount: 20,
                        spread: 40,
                        origin: { y: 0.5 },
                        colors: currentType === 'truth' ? ['#FF5C8A', '#FF8FAB'] : ['#C7A4FF', '#D4B8FF']
                    });
                } catch (e) {}
            };

            const getEmoji = (type) => type === 'truth' ? '❤️' : '💪';
            const truthCount = history.filter(h => h.type === 'truth').length;
            const dareCount = history.filter(h => h.type === 'dare').length;

            return (

                        <div className="wheel-pointer">▼</div>

                                style={{
                                    transform: `rotate(${rotation}deg)`,
                                    transition: isSpinning ? 'transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99)' : 'none',

                return saved || 'light';

            useEffect(() => {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('lc-theme', theme);
            }, [theme]);

            const toggleTheme = () => setTheme(t => t === 'light' ? 'dark' : 'light');

            return (
                <ThemeContext.Provider value={{ theme, toggleTheme }}>
                    <div className={`min-h-screen ${theme === 'dark' ? 'dark' : ''}`}>
